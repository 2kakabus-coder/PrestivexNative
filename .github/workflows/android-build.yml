name: Build Prestivex APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack Android source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q source/PrestivexNative-1.3.0-professional.zip -d buildsrc
          echo "PROJECT_DIR=$(find buildsrc -maxdepth 2 -name gradlew -printf '%h\n' | head -n 1)" >> "$GITHUB_ENV"

      - name: Validate project
        run: |
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/settings.gradle.kts"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon test assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/Prestivex-1.3.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prestivex-1.3.0-debug-apk
          path: output/Prestivex-1.3.0-debug.apk
          if-no-files-found: error
          retention-days: 30
